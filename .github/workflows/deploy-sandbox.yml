name: Deploy Sandbox

on:
  push:
    branches:
      - main


permissions:
  contents: read
  id-token: write

# Deploys queue behind each other rather than racing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  deploy:
    name: Deploy (sandbox)
    runs-on: ubuntu-latest
    needs: [checks]
    environment: sandbox
    env:
      NPM_ENVIRONMENT: sandbox
      CI: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            infra/package-lock.json
            web/package-lock.json

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_SANDBOX_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Install dependencies in infra/
        run: npm ci --prefix infra/

      - name: Install dependencies in web/
        run: npm ci --prefix web/

      # The SPA's config comes from the backend stacks' outputs, so deploy those
      # first, then build the web app, then deploy the CloudFront stack (whose
      # BucketDeployment uploads web/dist and invalidates the distribution).
      - name: Deploy backend stacks and CI role
        run: npm run ci-deploy-sandbox --prefix infra/ -- NakomisScrumGithubCi NakomisScrumCognito NakomisScrumApi NakomisScrumWebSocket

      - name: Build web app for sandbox
        run: npm run build:sandbox --prefix web/

      - name: Deploy CloudFront stack
        run: npm run ci-deploy-sandbox --prefix infra/ -- NakomisScrumCloudFront
