name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PROMOTE to confirm"
        required: true
        type: string


permissions:
  contents: read
  id-token: write

# Deploys queue behind each other rather than racing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  deploy:
    name: Deploy (prod)
    runs-on: ubuntu-latest
    needs: [checks]
    environment: production
    if: github.event.inputs.confirm == 'PROMOTE'
    env:
      NPM_ENVIRONMENT: prod
      CI: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            infra/package-lock.json
            web/package-lock.json

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PROD_ROLE_ARN }}
          aws-region: eu-west-2

      # Prod deploys the version sandbox last recorded, never a fresh bump.
      - name: Use the version deployed to sandbox
        run: |
          RESPONSE="$(curl -sS --fail --aws-sigv4 "aws:amz:eu-west-2:execute-api" \
            --user "${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}" \
            -H "x-amz-security-token: ${AWS_SESSION_TOKEN}" \
            "https://api.infra.nakomis.com/deployments/nakomis-scrum/sandbox/latest")"
          VERSION="$(jq -r '.version // empty' <<< "$RESPONSE")"
          if [[ -z "$VERSION" ]]; then echo "No sandbox version recorded in the tracker"; exit 1; fi
          jq -n --arg v "$VERSION" '{version: $v}' > infra/version.json
          cat infra/version.json

      - name: Install dependencies in infra/
        run: npm ci --prefix infra/

      - name: Install dependencies in web/
        run: npm ci --prefix web/

      # cdk synthesises the whole app, and the CloudFront stack's asset is
      # ../web/dist, so a placeholder must exist for this step. It does not ship:
      # the CloudFront stack is not deployed until the real build below.
      - name: Placeholder web/dist for the backend deploy
        run: mkdir -p web/dist && echo '<!doctype html>' > web/dist/index.html

      # The SPA's config comes from the backend stacks' outputs, so deploy those
      # first, then build the web app, then deploy the CloudFront stack (whose
      # BucketDeployment uploads web/dist and invalidates the distribution).
      - name: Deploy backend stacks and CI role
        run: npm run ci-deploy-prod --prefix infra/ -- NakomisScrumGithubCi NakomisScrumCognito NakomisScrumApi NakomisScrumWebSocket

      - name: Build web app for prod
        run: npm run build:prod --prefix web/

      - name: Deploy CloudFront stack
        run: npm run ci-deploy-prod --prefix infra/ -- NakomisScrumCloudFront

      - name: Record deployment (prod)
        uses: nakomis/nakomis-infra/.github/actions/record-deployment@main
        with:
          project: nakomis-scrum
          environment: prod
          version-file: infra/version.json
